name: contact_manager
description: A local SQLite contact management app built with Flutter.
version: 1.0.0+1

# This project uses SQLite on mobile and sqflite_common_ffi on desktop.
environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  path: ^1.9.1
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.3.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
